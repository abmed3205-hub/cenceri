<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مخزن مواد البناء</title>
<style>
:root{--primary:#1d5cff;--primary-soft:#e8efff;--orange:#e8571f;--orange-soft:#fff1ea;--green:#15a05a;--green-soft:#e7f8ef;--purple:#7c3aed;--purple-soft:#f3edff;--warn:#d97706;--warn-soft:#fff6e0;--danger:#dc2626;--danger-soft:#fdeaea;--bg:#f4f6fb;--card:#ffffff;--text:#1a2233;--muted:#6b7689;--line:#e6eaf2;--shadow:0 6px 20px rgba(20,40,90,.07)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--card:#171f33;--text:#e7ecf7;--muted:#97a3bb;--line:#26314a;--primary-soft:#1d2b52;--orange-soft:#3a2219;--green-soft:#133227;--purple-soft:#2a2046;--warn-soft:#3a2d12;--danger-soft:#3a1717;--shadow:none}}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}

/* واجهة تسجيل الدخول الأولى */
#loginScreen{position:fixed;inset:0;background:#ffffff;z-index:100;display:flex;flex-direction:column;justify-content:flex-start;padding:calc(16px + env(safe-area-inset-top,0px)) 20px 30px;overflow:auto}
#loginScreen .login-box{width:100%;max-width:460px;margin:0 auto}
#loginScreen .top-banner-wrap{width:100%;border-radius:22px;overflow:hidden;border:1px solid #e6eaf2;box-shadow:0 10px 24px rgba(20,40,90,.1);margin-bottom:34px;background:#0f172a}
#loginScreen .top-banner-wrap img{display:block;width:100%;height:270px;object-fit:cover}
#loginScreen .l-field{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
#loginScreen .l-field label{font-size:.92rem;font-weight:700;color:#1a2233}
#loginScreen .l-field input{padding:15px;border-radius:14px;border:1.5px solid #e6eaf2;background:#f8fafc;color:#1a2233;font-size:1rem;font-family:inherit;width:100%;direction:ltr;text-align:left;outline:none}
#loginScreen .l-field input:focus{border-color:var(--primary);background:#ffffff}
#loginError{display:none;background:#fdeaea;color:#dc2626;padding:12px 14px;border-radius:12px;font-size:.9rem;font-weight:600;margin-bottom:16px;text-align:center}

#app{max-width:560px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) 0 12px}
.logo{width:48px;height:48px;border-radius:14px;background:var(--primary);display:grid;place-items:center;color:#fff;font-size:24px;box-shadow:0 8px 18px rgba(29,92,255,.3)}
.brand b{display:block;font-size:1.15rem}
.brand span{color:var(--muted);font-size:.85rem}
.menu-btn{margin-inline-start:auto;width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:1.2rem;cursor:pointer;color:var(--text)}
h1{font-size:1.6rem;margin:10px 0 4px}
.sub{color:var(--muted);margin:0 0 16px}
.btn{border:0;border-radius:16px;padding:14px 18px;font-size:1rem;font-weight:600;cursor:pointer;background:var(--primary);color:#fff;font-family:inherit}
.btn.block{width:100%}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--line)}
.btn.sm{padding:8px 12px;font-size:.85rem;border-radius:12px}
.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);border:1px solid var(--line)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}
.stat{padding:16px;border-radius:22px;background:var(--card);box-shadow:var(--shadow);border:1px solid var(--line)}
.stat .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;color:var(--muted);font-size:.9rem}
.ico{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-size:1.15rem;flex:none}
.stat .val{font-size:1.2rem;font-weight:700;margin-top:14px;direction:ltr;text-align:right}
.stat .hint{color:var(--muted);font-size:.8rem;margin-top:4px}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px}
.section-title h2{font-size:1.1rem;margin:0}
.link{color:var(--orange);background:none;border:0;font-weight:600;cursor:pointer;font-family:inherit;font-size:.9rem}
.quick{display:flex;flex-direction:column;gap:10px}
.quick button{display:flex;align-items:center;gap:14px;padding:14px;border-radius:20px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);cursor:pointer;color:var(--text);font-family:inherit;font-size:1rem;text-align:start}
.quick .arrow{margin-inline-start:auto;color:var(--muted)}
.list{overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .meta{flex:1;min-width:0}
.row .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub2{color:var(--muted);font-size:.85rem;margin-top:2px;overflow:hidden;text-overflow:ellipsis}
.amount{font-weight:700;direction:ltr;white-space:nowrap}
.badge{font-size:.78rem;padding:4px 10px;border-radius:99px;white-space:nowrap;font-weight:600;display:inline-block;margin-top:4px}
.b-ok{background:var(--green-soft);color:var(--green)}
.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-out{background:var(--danger-soft);color:var(--danger)}
.b-credit{background:var(--orange-soft);color:var(--orange)}
.actions{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 14px;margin-top:-6px}
.empty{padding:24px;text-align:center;color:var(--muted)}
nav{position:fixed;bottom:0;inset-inline:0;max-width:560px;margin:0 auto;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:6}
nav button{background:none;border:0;color:var(--muted);font-family:inherit;font-size:.78rem;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px;cursor:pointer;border-radius:14px}
nav button .n-ico{font-size:1.2rem}
nav button.active{color:var(--primary);background:var(--primary-soft);font-weight:600}
.overlay{position:fixed;inset:0;background:rgba(10,16,30,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.overlay.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
.grip{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:0 0 14px;font-size:1.15rem}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:.88rem;color:var(--muted)}
.field input,.field select{padding:13px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:1rem;font-family:inherit;width:100%}
.hint2{color:var(--muted);font-size:.8rem}
.total-box{background:var(--primary-soft);color:var(--primary);border-radius:16px;padding:12px;text-align:center;font-weight:700;margin-bottom:12px;direction:ltr;display:none}
.form-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
#toast{position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-120px);background:#111827;color:#fff;padding:12px 18px;border-radius:14px;transition:transform .3s;z-index:30;max-width:90%;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- الواجهة الأولى: تسجيل الدخول -->
<div id="loginScreen">
  <div class="login-box">
    <div class="top-banner-wrap">
      <img src="./kankri-bachir-banner.jpg" alt="كنكري بشير — KANKRI BACHIR">
    </div>
    <div id="loginError">المعلومات غير صحيحة</div>
    <form id="loginForm" novalidate>
      <div class="l-field">
        <label for="loginEmail">البريد الإلكتروني (Email)</label>
        <input type="email" id="loginEmail" placeholder="example@gmail.com" autocomplete="email" required>
      </div>
      <div class="l-field">
        <label for="loginPass">كلمة السر (Mot de passe)</label>
        <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn block">Se connecter</button>
    </form>
  </div>
</div>

<div id="app">
  <header>
    <div class="logo">🧱</div>
    <div class="brand"><b>مخزن مواد البناء</b><span>إدارة المخزون والمبيعات</span></div>
    <button class="menu-btn" id="menuBtn" title="إعادة ضبط البيانات">☰</button>
  </header>
  <main id="main"></main>
</div>
<nav id="nav"></nav>
<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<script>
/* منطق الواجهة الأولى */
const ALLOWED_EMAIL = "abmed3205@gmail.com";
const ALLOWED_PASS = "36654787";
const loginScreen = document.getElementById("loginScreen");
const loginForm = document.getElementById("loginForm");
const loginError = document.getElementById("loginError");

if (sessionStorage.getItem("depot_logged_in") === "1") {
  loginScreen.style.display = "none";
}

loginForm.addEventListener("submit", function(e) {
  e.preventDefault();
  const emailVal = document.getElementById("loginEmail").value.trim().toLowerCase();
  const passVal = document.getElementById("loginPass").value.trim();
  if (emailVal === ALLOWED_EMAIL && passVal === ALLOWED_PASS) {
    loginError.style.display = "none";
    sessionStorage.setItem("depot_logged_in", "1");
    loginScreen.style.display = "none";
  } else {
    loginError.style.display = "block";
  }
});

const KEY = "depot-app-v2-zero";
const $ = id => document.getElementById(id);

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function pad(n) { return String(n).padStart(2, "0"); }
function dateStr(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function today() { return dateStr(new Date()); }
function daysAgo(n) { const d = new Date(); d.setDate(d.getDate() + n); return dateStr(d); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function money(n) { return Math.round(n || 0).toLocaleString("en-US") + " MRU"; }
function num(n) { return Math.round(n || 0).toLocaleString("en-US"); }
function sum(arr, f) { return arr.reduce((a, x) => a + (f(x) || 0), 0); }
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove("show"), 2200);
}

/* بداية نظيفة من الصفر بدون أي مبالغ أو أصناف أو مبيعات مسبقة */
function seed() {
  return {
    products: [],
    sales: []
  };
}
function load() {
  try {
    const r = localStorage.getItem(KEY);
    if (r) return JSON.parse(r);
  } catch (e) {}
  return seed();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} }

let db = load();
let view = "home";
save();

function stats() {
  const t = today();
  const todaySales = db.sales.filter(s => s.date === t);
  return {
    todayCount: todaySales.length,
    todayAmt: sum(todaySales, s => s.total),
    revenue: sum(db.sales, s => s.total),
    salesCount: db.sales.length,
    refs: db.products.length,
    units: sum(db.products, p => p.stock),
    value: sum(db.products, p => p.stock * p.buy),
    out: db.products.filter(p => p.stock <= 0).length,
    debt: sum(db.sales, s => s.total - s.paid)
  };
}

function stockBadge(p) {
  if (p.stock <= 0) return el("span", "badge b-out", "نفد");
  if (p.stock <= p.min) return el("span", "badge b-warn", p.stock + " متبقي");
  return el("span", "badge b-ok", p.stock + " متوفر");
}

function statCard(icon, bg, label, value, hint) {
  const c = el("div", "stat");
  const top = el("div", "top");
  top.appendChild(el("span", "", label));
  const ic = el("div", "ico", icon);
  ic.style.background = bg;
  top.appendChild(ic);
  c.appendChild(top);
  c.appendChild(el("div", "val", value));
  if (hint) c.appendChild(el("div", "hint", hint));
  return c;
}

function sectionTitle(text, link) {
  const h = el("div", "section-title");
  h.appendChild(el("h2", "", text));
  if (link) {
    const b = el("button", "link", link[0]);
    b.onclick = link[1];
    h.appendChild(b);
  }
  return h;
}

function salesList(list) {
  const c = el("div", "card list");
  if (!list.length) { c.appendChild(el("div", "empty", "لا توجد مبيعات بعد")); return c; }
  list.forEach(s => {
    const r = el("div", "row");
    const ic = el("div", "ico", "🧾");
    ic.style.background = "var(--orange-soft)";
    r.appendChild(ic);
    const m = el("div", "meta");
    m.appendChild(el("div", "name", s.customer));
    m.appendChild(el("div", "sub2", s.date + " · " + s.time + " · " + s.items.map(i => i.name + " ×" + i.qty).join("، ")));
    r.appendChild(m);
    const right = el("div");
    right.style.textAlign = "left";
    right.appendChild(el("div", "amount", money(s.total)));
    const rem = s.total - s.paid;
    if (rem > 0) right.appendChild(el("span", "badge b-credit", "باقي " + num(rem)));
    r.appendChild(right);
    c.appendChild(r);
  });
  return c;
}

function buildHome() {
  const s = stats();
  const wrap = el("div");
  wrap.appendChild(el("h1", "", "لوحة التحكم"));
  wrap.appendChild(el("p", "sub", "ملخص نشاط مخزنك"));
  const big = el("button", "btn block", "+ بيع جديد");
  big.onclick = () => openSale();
  wrap.appendChild(big);

  const grid = el("div", "stats");
  grid.appendChild(statCard("🧾", "var(--orange-soft)", "مبيعات اليوم", money(s.todayAmt), s.todayCount + " عملية"));
  grid.appendChild(statCard("💰", "var(--green-soft)", "إجمالي الدخل", money(s.revenue), s.salesCount + " عملية"));
  grid.appendChild(statCard("📦", "var(--primary-soft)", "الأصناف", num(s.refs), num(s.units) + " وحدة في المخزون"));
  grid.appendChild(statCard("🧱", "var(--purple-soft)", "قيمة المخزون", money(s.value), s.out ? s.out + " صنف نفد" : "بسعر الشراء"));
  wrap.appendChild(grid);

  if (s.debt > 0) {
    const d = el("div", "card");
    d.style.cssText = "padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px";
    d.appendChild(el("span", "", "ديون الزبائن غير المسددة"));
    const a = el("span", "amount", money(s.debt));
    a.style.color = "var(--orange)";
    d.appendChild(a);
    wrap.appendChild(d);
  }

  wrap.appendChild(sectionTitle("وصول سريع"));
  const q = el("div", "quick");
  [
    ["🧾", "بيع جديد", "var(--orange-soft)", () => openSale()],
    ["📦", "إدارة المخزون", "var(--primary-soft)", () => go("stock")],
    ["👥", "الزبائن والديون", "var(--green-soft)", () => go("customers")]
  ].forEach(([i, t, bg, fn]) => {
    const b = el("button");
    const ic = el("span", "ico", i);
    ic.style.background = bg;
    b.appendChild(ic);
    b.appendChild(el("span", "", t));
    b.appendChild(el("span", "arrow", "←"));
    b.onclick = fn;
    q.appendChild(b);
  });
  wrap.appendChild(q);

  wrap.appendChild(sectionTitle("آخر المبيعات", ["عرض الكل", () => go("sales")]));
  wrap.appendChild(salesList(db.sales.slice(0, 4)));

  wrap.appendChild(sectionTitle("مخزون يحتاج متابعة"));
  const low = db.products.filter(p => p.stock <= p.min);
  const lc = el("div", "card list");
  if (!low.length) lc.appendChild(el("div", "empty", "كل الأصناف بكميات كافية ✓"));
  low.forEach(p => {
    const r = el("div", "row");
    const m = el("div", "meta");
    m.appendChild(el("div", "name", p.name));
    m.appendChild(el("div", "sub2", p.unit + " · الحد الأدنى " + p.min));
    r.appendChild(m);
    r.appendChild(stockBadge(p));
    lc.appendChild(r);
  });
  wrap.appendChild(lc);
  return wrap;
}

function buildStock() {
  const wrap = el("div");
  wrap.appendChild(el("h1", "", "المخزون"));
  wrap.appendChild(el("p", "sub", "كل الأصناف وكمياتها وأسعارها"));
  const add = el("button", "btn block", "+ إضافة صنف جديد");
  add.onclick = () => openProduct(null);
  wrap.appendChild(add);

  const list = el("div", "card list");
  list.style.marginTop = "16px";
  if (!db.products.length) list.appendChild(el("div", "empty", "لا توجد أصناف"));
  db.products.forEach(p => {
    const r = el("div", "row");
    const m = el("div", "meta");
    m.appendChild(el("div", "name", p.name));
    m.appendChild(el("div", "sub2", "شراء " + num(p.buy) + " · بيع " + num(p.sell) + " · " + p.unit));
    r.appendChild(m);
    r.appendChild(stockBadge(p));
    list.appendChild(r);

    const a = el("div", "actions");
    const b1 = el("button", "btn ghost sm", "+ تزويد");
    b1.onclick = () => openRestock(p);
    const b2 = el("button", "btn ghost sm", "تعديل");
    b2.onclick = () => openProduct(p);
    const b3 = el("button", "btn ghost sm", "حذف");
    b3.style.color = "var(--danger)";
    b3.onclick = () => deleteProduct(p);
    a.append(b1, b2, b3);
    list.appendChild(a);
  });
  wrap.appendChild(list);
  return wrap;
}

function buildSales() {
  const wrap = el("div");
  wrap.appendChild(el("h1", "", "المبيعات"));
  wrap.appendChild(el("p", "sub", "سجل كل عمليات البيع"));
  const b = el("button", "btn block", "+ بيع جديد");
  b.onclick = () => openSale();
  wrap.appendChild(b);
  const c = el("div");
  c.style.marginTop = "16px";
  c.appendChild(salesList(db.sales));
  wrap.appendChild(c);
  return wrap;
}

function customersMap() {
  const map = {};
  db.sales.forEach(s => {
    const k = s.customer;
    if (!map[k]) map[k] = { name: k, count: 0, total: 0, debt: 0 };
    map[k].count++;
    map[k].total += s.total;
    map[k].debt += s.total - s.paid;
  });
  return Object.values(map).sort((a, b) => (b.debt - a.debt) || (b.total - a.total));
}

function buildCustomers() {
  const wrap = el("div");
  wrap.appendChild(el("h1", "", "الزبائن"));
  wrap.appendChild(el("p", "sub", "مشترياتهم وديونهم غير المسددة"));
  const list = el("div", "card list");
  const cs = customersMap();
  if (!cs.length) list.appendChild(el("div", "empty", "لا يوجد زبائن بعد"));
  cs.forEach(c => {
    const r = el("div", "row");
    const ic = el("div", "ico", "👤");
    ic.style.background = "var(--primary-soft)";
    r.appendChild(ic);
    const m = el("div", "meta");
    m.appendChild(el("div", "name", c.name));
    m.appendChild(el("div", "sub2", c.count + " عملية · إجمالي " + money(c.total)));
    r.appendChild(m);
    const right = el("div");
    right.style.textAlign = "left";
    if (c.debt > 0) {
      right.appendChild(el("div", "amount", money(c.debt)));
      right.appendChild(el("span", "badge b-credit", "دين"));
    } else {
      right.appendChild(el("span", "badge b-ok", "مسدّد"));
    }
    r.appendChild(right);
    list.appendChild(r);
    if (c.debt > 0) {
      const a = el("div", "actions");
      const b = el("button", "btn sm", "تسديد دفعة");
      b.onclick = () => openPayDebt(c);
      a.appendChild(b);
      list.appendChild(a);
    }
  });
  wrap.appendChild(list);
  return wrap;
}

function render() {
  const main = $("main");
  main.innerHTML = "";
  const builders = { home: buildHome, stock: buildStock, sales: buildSales, customers: buildCustomers };
  main.appendChild(builders[view]());

  const nav = $("nav");
  nav.innerHTML = "";
  [["home", "🏠", "الرئيسية"], ["stock", "📦", "المخزون"], ["sales", "🧾", "المبيعات"], ["customers", "👥", "الزبائن"]]
    .forEach(([k, i, t]) => {
      const b = el("button", view === k ? "active" : "");
      b.appendChild(el("span", "n-ico", i));
      b.appendChild(el("span", "", t));
      b.onclick = () => go(k);
      nav.appendChild(b);
    });
  window.scrollTo(0, 0);
}
function go(v) { view = v; render(); }

/* ---------- نافذة النماذج ---------- */
function openForm(title, fields, submitText, onSubmit, onLive) {
  const sheet = $("sheet");
  sheet.innerHTML = "";
  sheet.appendChild(el("div", "grip"));
  sheet.appendChild(el("h3", "", title));

  const inputs = {};
  fields.forEach(f => {
    const wrap = el("div", "field");
    wrap.appendChild(el("label", "", f.label));
    let input;
    if (f.type === "select") {
      input = el("select");
      f.options.forEach(([v, l]) => {
        const o = el("option", "", l);
        o.value = v;
        input.appendChild(o);
      });
    } else {
      input = el("input");
      input.type = f.type || "text";
      if (f.type === "number") { input.inputMode = "decimal"; input.min = "0"; input.step = "any"; }
    }
    input.value = f.value ?? "";
    if (f.placeholder) input.placeholder = f.placeholder;
    inputs[f.key] = input;
    wrap.appendChild(input);
    if (f.hint) wrap.appendChild(el("div", "hint2", f.hint));
    sheet.appendChild(wrap);
  });

  const values = () => {
    const o = {};
    for (const k in inputs) o[k] = inputs[k].value;
    return o;
  };

  const tot = el("div", "total-box");
  sheet.appendChild(tot);
  if (onLive) {
    const upd = () => {
      const t = onLive(values());
      tot.textContent = t || "";
      tot.style.display = t ? "block" : "none";
    };
    Object.values(inputs).forEach(i => {
      i.addEventListener("input", upd);
      i.addEventListener("change", upd);
    });
    upd();
  }

  const actions = el("div", "form-actions");
  const cancel = el("button", "btn ghost", "إلغاء");
  cancel.onclick = closeModal;
  const ok = el("button", "btn", submitText);
  ok.onclick = () => {
    const err = onSubmit(values());
    if (err) { toast(err); return; }
    save();
    closeModal();
    render();
  };
  actions.append(cancel, ok);
  sheet.appendChild(actions);

  $("overlay").classList.add("show");
  return inputs;
}
function closeModal() { $("overlay").classList.remove("show"); }
$("overlay").addEventListener("click", e => { if (e.target.id === "overlay") closeModal(); });

/* ---------- العمليات ---------- */
function openSale() {
  if (!db.products.length) { toast("أضف صنفاً أولاً"); return; }
  const first = db.products[0];
  const inputs = openForm("بيع جديد", [
    { key: "product", label: "الصنف", type: "select", options: db.products.map(p => [p.id, p.name + " (متوفر " + p.stock + ")"]), value: first.id },
    { key: "qty", label: "الكمية", type: "number", value: "1" },
    { key: "price", label: "سعر الوحدة (MRU)", type: "number", value: String(first.sell) },
    { key: "customer", label: "اسم الزبون", placeholder: "مثال: محمد" },
    { key: "pay", label: "طريقة الدفع", type: "select", options: [["cash", "نقدي (مدفوع كاملاً)"], ["credit", "آجل (دين كامل)"], ["partial", "دفعة جزئية"]], value: "cash" },
    { key: "paid", label: "المبلغ المدفوع (للدفعة الجزئية)", type: "number", value: "0" }
  ], "تسجيل البيع", v => {
    const p = db.products.find(x => x.id === v.product);
    const qty = parseInt(v.qty, 10);
    const price = parseFloat(v.price);
    if (!p) return "اختر صنفاً";
    if (!qty || qty <= 0) return "أدخل كمية صحيحة";
    if (qty > p.stock) return "الكمية أكبر من المتوفر (" + p.stock + ")";
    if (!(price >= 0)) return "أدخل سعراً صحيحاً";
    const total = qty * price;
    let paid = total;
    if (v.pay === "credit") paid = 0;
    if (v.pay === "partial") paid = Math.min(Math.max(parseFloat(v.paid) || 0, 0), total);
    p.stock -= qty;
    const now = new Date();
    db.sales.unshift({
      id: uid(),
      date: today(),
      time: pad(now.getHours()) + ":" + pad(now.getMinutes()),
      customer: v.customer.trim() || "زبون عام",
      items: [{ pid: p.id, name: p.name, qty, price }],
      total,
      paid
    });
    toast("تم تسجيل البيع ✓");
    return null;
  }, v => {
    const q = parseFloat(v.qty) || 0, pr = parseFloat(v.price) || 0;
    return "الإجمالي: " + money(q * pr) + (v.pay === "credit" ? " (آجل)" : "");
  });

  inputs.product.addEventListener("change", () => {
    const p = db.products.find(x => x.id === inputs.product.value);
    if (p) {
      inputs.price.value = p.sell;
      inputs.price.dispatchEvent(new Event("input"));
    }
  });
}

function openProduct(p) {
  openForm(p ? "تعديل الصنف" : "إضافة صنف", [
    { key: "name", label: "اسم الصنف", value: p ? p.name : "", placeholder: "مثال: الأسمنت، الحديد، المطل..." },
    { key: "unit", label: "وحدة القياس", value: p ? p.unit : "", placeholder: "كيس، قطعة، م²..." },
    { key: "buy", label: "سعر الشراء", type: "number", value: p ? String(p.buy) : "0" },
    { key: "sell", label: "سعر البيع", type: "number", value: p ? String(p.sell) : "0" },
    { key: "stock", label: "الكمية الحالية", type: "number", value: p ? String(p.stock) : "0" },
    { key: "min", label: "حد التنبيه (الحد الأدنى)", type: "number", value: p ? String(p.min) : "5" }
  ], "حفظ", v => {
    const name = v.name.trim();
    if (!name) return "اكتب اسم الصنف";
    const data = {
      name,
      unit: v.unit.trim() || "وحدة",
      buy: parseFloat(v.buy) || 0,
      sell: parseFloat(v.sell) || 0,
      stock: parseInt(v.stock, 10) || 0,
      min: parseInt(v.min, 10) || 0
    };
    if (p) Object.assign(p, data);
    else db.products.push({ id: uid(), ...data });
    return null;
  });
}

function openRestock(p) {
  openForm("تزويد المخزون: " + p.name, [
    { key: "qty", label: "الكمية الواردة (" + p.unit + ")", type: "number", value: "1" },
    { key: "buy", label: "سعر الشراء للدفعة الجديدة", type: "number", value: String(p.buy), hint: "يُحسب متوسط سعر الشراء تلقائياً" }
  ], "تزويد", v => {
    const q = parseInt(v.qty, 10);
    if (!q || q <= 0) return "أدخل كمية صحيحة";
    const nb = parseFloat(v.buy);
    if (nb > 0) p.buy = Math.round((p.buy * p.stock + nb * q) / (p.stock + q));
    p.stock += q;
    toast("تم تزويد المخزون ✓");
    return null;
  });
}

function deleteProduct(p) {
  if (!confirm("حذف " + p.name + "؟ (المبيعات السابقة تبقى محفوظة)")) return;
  db.products = db.products.filter(x => x.id !== p.id);
  save();
  render();
  toast("تم الحذف");
}

function openPayDebt(c) {
  openForm("تسديد دفعة: " + c.name, [
    { key: "amount", label: "المبلغ المدفوع (MRU)", type: "number", value: String(Math.round(c.debt)), hint: "الدين الحالي: " + money(c.debt) + " — يُوزَّع على أقدم الفواتير أولاً" }
  ], "تسجيل الدفعة", v => {
    let amt = parseFloat(v.amount);
    if (!(amt > 0)) return "أدخل مبلغاً صحيحاً";
    amt = Math.min(amt, c.debt);
    const list = db.sales
      .filter(s => s.customer === c.name && s.total > s.paid)
      .sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
    for (const s of list) {
      if (amt <= 0) break;
      const pay = Math.min(s.total - s.paid, amt);
      s.paid += pay;
      amt -= pay;
    }
    toast("تم تسجيل الدفعة ✓");
    return null;
  });
}

$("menuBtn").onclick = () => {
  if (!confirm("إعادة ضبط كل البيانات؟ سيتم حذف كل المبيعات والأصناف والمبالغ والبدء من الصفر.")) return;
  try { localStorage.removeItem(KEY); } catch (e) {}
  db = seed();
  save();
  view = "home";
  render();
  toast("تمت إعادة الضبط إلى الصفر");
};

render();
</script>
